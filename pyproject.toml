[project]
name = "glc-v5"
version = "0.5.0"
description = "GLC v5 — glc_v4 plus one generic bidirectional connection between every channel adapter and S16Code."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "websockets>=12.0",
    "twilio>=9.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
    "modal>=1.5.1",
    # v4 — OpenTelemetry. The GenAI semantic conventions moved to their own
    # repo in June 2026 and still have no tagged release, so the attribute
    # names live in glc/telemetry/otel.py as pinned constants rather than
    # being imported from a package that may rename them.
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
glc = "glc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glc"]
# The operator pages are part of the product, not repo decoration. Without
# this a non-editable install resolves STATIC into site-packages and every
# page 404s while the API keeps working, which is a confusing way to fail.
force-include = { "static" = "glc/_static" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "requires_live_api: tests that need real provider credentials (skipped in CI)",
    "requires_models: tests that need local model downloads (Kokoro / whisper.cpp)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# V9-ported modules — kept verbatim from llm_gatewayV9. These have
# pre-existing minor smells (unused intermediate variables, B904 raise-from
# style, B023 loop-bound closures in retry logic) that we accept as-is so
# the V9 fixes are not re-introduced during a touch-up.
"glc/providers.py" = ["B023", "B904", "F841"]
"glc/routes/chat.py" = ["B023", "B904", "F841"]
"glc/embedders.py" = ["B023", "B904", "F841"]
"glc/routing/core.py" = ["B023", "B904", "F841"]
# v4: the compat shim deliberately reaches for a private helper in
# economics.pricing so the v3 signature keeps its exact semantics.
"glc/pricing.py" = ["SLF001"]
# Stub adapters intentionally redefine narrow abstract types — quiet B027.
"glc/channels/base.py" = ["B027"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = false

[tool.coverage.run]
source = ["glc"]
omit = [
    # V9-ported provider/embedder/cache code — requires live API keys
    # to exercise meaningfully. The V9 test suite covers these.
    "glc/providers.py",
    "glc/embedders.py",
    "glc/cache/gemini.py",
    "glc/llm_schemas.py",
    "glc/pricing.py",
    "glc/routing/core.py",
    "glc/db.py",
    "glc/routes/chat.py",
    # Channel adapter stubs raise NotImplementedError — the green path
    # is tested per-PR through adapter-pr.yml.
    "glc/channels/catalogue/*",
    # Voice provider stubs and helper wrappers — same exemption as
    # channel adapter stubs. Real-call code paths need keys and model
    # downloads; the catalogue test pattern uses mocks.
    "glc/voice/stt/providers/*",
    "glc/voice/tts/providers/*",
    # CLI is a thin argparse shim around glc.main:app.
    "glc/cli.py",
]
